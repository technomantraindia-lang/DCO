<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 52" fill="none">
  <!-- THE -->
  <text x="3" y="10" font-family="'Manrope', 'Inter', sans-serif" font-size="8.5" font-weight="300" letter-spacing="3" fill="#B4A17A">THE</text>
  
  <!-- D -->
  <text x="2" y="32" font-family="'Manrope', 'Inter', sans-serif" font-size="22" font-weight="300" fill="#EAE3DA" letter-spacing="1">D</text>
  
  <!-- Decorative Square 'E' (Architectural Block) -->
  <rect x="23" y="16.5" width="22" height="15.5" fill="#B4A17A" rx="0.5" />
  
  <!-- CO -->
  <text x="50" y="32" font-family="'Manrope', 'Inter', sans-serif" font-size="22" font-weight="300" fill="#EAE3DA" letter-spacing="1.5">CO</text>
  
  <!-- HOUS -->
  <text x="100" y="32" font-family="'Manrope', 'Inter', sans-serif" font-size="22" font-weight="300" fill="#EAE3DA" letter-spacing="1.5">HOUS</text>
  
  <!-- Architectural 3 Bars 'E' -->
  <g transform="translate(196, 17)">
    <line x1="0" y1="2" x2="16" y2="2" stroke="#EAE3DA" stroke-width="2.2" stroke-linecap="square"/>
    <line x1="0" y1="7.5" x2="16" y2="7.5" stroke="#EAE3DA" stroke-width="2.2" stroke-linecap="square"/>
    <line x1="0" y1="13" x2="16" y2="13" stroke="#EAE3DA" stroke-width="2.2" stroke-linecap="square"/>
  </g>
  
  <!-- Descriptor: SURFACES | MATERIALS | SOLUTIONS -->
  <text x="3" y="47" font-family="'Manrope', 'Inter', sans-serif" font-size="7" font-weight="300" letter-spacing="2.2" fill="#A79A8B">SURFACES <tspan fill="#B4A17A">|</tspan> MATERIALS <tspan fill="#B4A17A">|</tspan> SOLUTIONS</text>
</svg>
